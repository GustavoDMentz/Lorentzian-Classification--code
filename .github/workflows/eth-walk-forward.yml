name: ETH-USDT Walk-Forward

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full_audit runs 2022, 2023 and 2024-2025 automatically; custom uses dates below'
        required: true
        default: 'full_audit'
        type: choice
        options:
          - full_audit
          - custom
      data_url:
        description: 'Public HTTPS URL to ETH-USDT 1h OHLC CSV (date/open/high/low/close); optional'
        required: false
        type: string
      start:
        description: 'UTC start date (inclusive)'
        required: true
        default: '2024-01-01'
        type: string
      end:
        description: 'UTC end date (exclusive)'
        required: true
        default: '2024-05-01'
        type: string
      train_bars:
        description: 'Initial training hours'
        required: true
        default: '1440'
        type: string
      test_bars:
        description: 'Walk-forward test hours'
        required: true
        default: '336'
        type: string
      cost_bps:
        description: 'Cost per turnover unit (bps)'
        required: true
        default: '10'
        type: string

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn TA-Lib
      - name: Validate indicator tournament
        run: |
          python -m unittest discover -s tests -p "test_indicator_tournament.py" -v
          python -m unittest discover -s tests -p "test_stateful_systems.py" -v
          python -m unittest discover -s tests -p "test_adaptive_selector.py" -v
      - name: Run selected audit
        env:
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DATA_URL: ${{ inputs.data_url }}
          TRAIN: ${{ inputs.train_bars }}
          TEST: ${{ inputs.test_bars }}
          COST: ${{ inputs.cost_bps }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full_audit" ]; then
            if [ -n "$DATA_URL" ]; then
              echo "data_url is supported only in custom mode" >&2
              exit 1
            fi
            periods=("2022:2022-01-01:2023-01-01" "2023:2023-01-01:2024-01-01" "2024-2025:2024-01-01:2026-01-01")
          else
            periods=("custom:$START:$END")
          fi
          for period in "${periods[@]}"; do
            IFS=: read -r label from to <<< "$period"
            mkdir -p "results/$label"
            if [ "$MODE" = "custom" ] && [ -n "$DATA_URL" ]; then
              python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          url = os.environ["DATA_URL"]
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("data_url must be HTTPS")
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(30_000_001)
          if len(data) > 30_000_000:
              raise SystemExit("CSV exceeds 30 MB limit")
          with open("eth_usdt_1h.csv", "wb") as out:
              out.write(data)
          PY
            else
              python fetch_kucoin.py --start "$from" --end "$to" --output eth_usdt_1h.csv
            fi
            python run_walk_forward.py eth_usdt_1h.csv --train-bars "$TRAIN" --test-bars "$TEST" --cost-bps "$COST" --output-dir "results/$label"
            cp eth_usdt_1h.csv "results/$label/eth_usdt_1h.csv"
          done
      - name: Aggregate cross-regime ranking
        run: python aggregate_tournament.py results
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-usdt-walk-forward
          path: |
            results/
          if-no-files-found: warn
          retention-days: 14
