name: ETH-USDT Walk-Forward

on:
  workflow_dispatch:
    inputs:
      data_url:
        description: 'Public HTTPS URL to ETH-USDT 1h OHLC CSV (date/open/high/low/close); optional'
        required: false
        type: string
      start:
        description: 'UTC start date (inclusive)'
        required: true
        default: '2024-01-01'
        type: string
      end:
        description: 'UTC end date (exclusive)'
        required: true
        default: '2024-05-01'
        type: string
      train_bars:
        description: 'Initial training hours'
        required: true
        default: '1440'
        type: string
      test_bars:
        description: 'Walk-forward test hours'
        required: true
        default: '336'
        type: string
      cost_bps:
        description: 'Cost per turnover unit (bps)'
        required: true
        default: '10'
        type: string

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn TA-Lib
      - name: Obtain ETH-USDT hourly candles
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DATA_URL: ${{ inputs.data_url }}
        run: |
          if [ -n "$DATA_URL" ]; then
            python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          url = os.environ["DATA_URL"]
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("data_url must be HTTPS")
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(30_000_001)
          if len(data) > 30_000_000:
              raise SystemExit("CSV exceeds 30 MB limit")
          with open("eth_usdt_1h.csv", "wb") as out:
              out.write(data)
          PY
          else
            python fetch_kucoin.py --start "$START" --end "$END" --output eth_usdt_1h.csv
          fi
      - name: Run walk-forward evaluation
        env:
          TRAIN: ${{ inputs.train_bars }}
          TEST: ${{ inputs.test_bars }}
          COST: ${{ inputs.cost_bps }}
        run: |
          python run_walk_forward.py eth_usdt_1h.csv --train-bars "$TRAIN" --test-bars "$TEST" --cost-bps "$COST" --output-dir results
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-usdt-walk-forward
          path: |
            results/
            eth_usdt_1h.csv
          if-no-files-found: warn
          retention-days: 14
