name: Frozen ETH ML cross-asset research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/test_research_multi_asset.py'
      - '.github/workflows/frozen-eth-ml.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Validate causal research utilities
        run: python -m unittest discover -s tests -p 'test_research_multi_asset.py' -v
      - name: Fetch ETH from KuCoin
        run: mkdir -p research_data && python fetch_kucoin.py --start 2022-01-01 --end 2026-10-23 --output research_data/ETH_USDT_1h.csv
      - name: Fetch BTC SOL and ADA from KuCoin
        run: python research/fetch_multi_asset.py --start 2022-01-01 --end 2026-10-23 --output-dir research_data
      - name: Test frozen ETH ML on BTC and SOL
        run: python research/frozen_eth_ml.py --input-dir research_data
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-eth-ml-cross-asset
          path: research_data/
          retention-days: 14
          if-no-files-found: warn
