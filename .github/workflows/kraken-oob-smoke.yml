name: Kraken OOB public API smoke test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/kraken_oob_observer.py'
      - 'tests/test_kraken_oob_observer.py'
      - '.github/workflows/kraken-oob-smoke.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_kraken_oob_observer.py' -v
      - name: Collect 3 read-only OOB/USD snapshots
        run: python research/kraken_oob_observer.py --samples 3 --interval 10
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-oob-smoke-observations
          path: research_data/kraken_oob/
          retention-days: 7
          if-no-files-found: warn
