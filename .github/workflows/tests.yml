name: Causality tests
on:
  push:
    branches: [fix/causal-labels-and-tests]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas scikit-learn TA-Lib
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
